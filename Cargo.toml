[package]
name = "minecraft"
version = "0.1.0"
authors = ["PeterTiny1 <56882034+PeterTiny1@users.noreply.github.com>"]
edition = "2024"

[dependencies]
wgpu = "27.0"
bytemuck = { version = "1.24", features = ["derive"] }
vek = { version = "0.17", default-features = false }
noise = { version = "0.9", default-features = false }
bincode-next = { version = "3.1.1", features = ["serde"] } # Pin exact version and features
winit = "0.30"
pollster = "0.4.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "ansi", "env-filter", "tracing-log"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.dev]
opt-level = 1 # Keeps your game code fast to compile while remaining playable

[profile.dev.package."*"]
opt-level = 2 # Fast compile times for external heavy math/rendering crates with high FPS

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort" # Prevents unwinding overhead in game releases
strip = true    # Strips debug symbols for smaller binaries
