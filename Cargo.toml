[package]
name = "minecraft"
version = "0.1.0"
edition = "2024"
authors = ["PeterTiny1 <56882034+PeterTiny1@users.noreply.github.com>"]

[dependencies]
wgpu = "30.0"
bytemuck = { version = "1.24", features = ["derive"] }
vek = { version = "0.17", default-features = false, features = ["bytemuck"] }
noise = { version = "0.9", default-features = false }
pollster = "1.0.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "ansi", "env-filter", "tracing-log"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rkyv = { version = "0.8.18", features = ["bytecheck"] }
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }

[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30", features = ["x11", "wayland", "wayland-dlopen"] }

[lints.rust]
unexpected_cfgs = "warn"

[lints.clippy]
perf = { level = "deny", priority = -1 }
style = { level = "warn", priority = -1 }

# --- Keep standard quality checks ---
unwrap_used = "warn"
large_types_passed_by_value = "warn"
cloned_instead_of_copied = "warn"
inefficient_to_string = "warn"

# --- Silence math/voxel noise ---
suboptimal_flops = "allow"        # Keeps `a * b + c` readable instead of forced `mul_add`
imprecise_flops = "allow"
cast_possible_truncation = "allow" # Essential for frequent f32 -> i32 -> usize voxel math
cast_precision_loss = "allow"
cast_sign_loss = "allow"

[profile.dev]
opt-level = 1 # Keeps project code fast to compile while remaining playable

[profile.dev.package."*"]
opt-level = 3 # Max performance for heavy math, noise, and rendering dependencies
debug = false

[profile.release]
opt-level = 3
lto = "fat"      # Maximum cross-crate inlining for high frame rates
codegen-units = 1
panic = "abort"  # Eliminates unwinding landing pads and reduces binary size
strip = true     # Removes symbols and debug info
